<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy 18th Birthday, Anu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --kraft:#c9b285;
    --kraft-dark:#a98f5f;
    --ink:#2b1f14;
    --paper-w: 380px;
    --paper-h: calc(var(--paper-w) * 990 / 700);
    --accent:#8f2d2d;
    --gold:#e8b62b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.05), transparent 40%),
      repeating-linear-gradient(45deg, rgba(0,0,0,.025) 0 2px, transparent 2px 6px),
      var(--kraft);
    font-family: Georgia, 'Times New Roman', serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:8vh;
    padding-bottom:6vh;
    overflow-x:hidden;
  }
  @media (max-width:480px){
    :root{ --paper-w: min(80vw, 340px); }
    body{padding-top:9vh;}
  }

  #stage{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    perspective:1800px;
  }

  /* ---------- COVER ---------- */
  #coverCard{
    width:var(--paper-w);
    height:var(--paper-h);
    cursor:pointer;
    border-radius:4px;
    box-shadow:0 18px 40px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
    transform-style:preserve-3d;
    transform-origin:center center;
    transition:transform .65s cubic-bezier(.6,.05,.25,1), opacity .5s ease .15s;
    position:relative;
  }
  #coverCard img{width:100%;height:100%;display:block;border-radius:4px;object-fit:cover;}
  #coverCard .hint{
    position:absolute; left:0; right:0; bottom:-2.2em; text-align:center;
    font-size:.85rem; letter-spacing:.03em; color:var(--kraft-dark);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  #coverCard.opening{
    transform:rotateY(-100deg) scale(.9);
    opacity:0;
    pointer-events:none;
  }
  #stage.hideCoverArea{display:none;}

  /* ---------- SPREAD ---------- */
  #bookArea{ position:relative; }
  .spread{
    display:flex;
    align-items:flex-start;
    gap:10px;
    opacity:0;
    transform:scale(.94);
    transition:opacity .45s ease, transform .45s ease;
    pointer-events:none;
    position:absolute;
    top:0; left:0;
  }
  .spread.show{opacity:1; transform:scale(1); pointer-events:auto; position:relative;}
  .page{
    width:var(--paper-w);
    height:var(--paper-h);
    background:#e9ddc2;
    border-radius:3px;
    box-shadow:0 14px 34px rgba(0,0,0,.3);
    position:relative;
    overflow:hidden;
  }
  /* ---------- LEFT PAGE: envelope ---------- */
  .left-page{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.15) 0 2px, transparent 2px 34px),
      #e3d3ac;
    display:flex; align-items:center; justify-content:center;
  }
  .envelope{
    position:relative;
    width:94%;
    height:58%;
  }
  .envelope-body{
    position:absolute; inset:0;
    background:#cbaf7d;
    border:1px solid rgba(0,0,0,.15);
    border-radius:3px;
    box-shadow:inset 0 6px 14px rgba(0,0,0,.15);
  }
  .envelope-flap{
    position:absolute; left:0; right:0; top:0; height:52%;
    background:#bfa06c;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    border-bottom:1px solid rgba(0,0,0,.12);
    z-index:3;
  }
  .tucked{
    position:absolute;
    left:50%;
    width:78%;
    border-radius:2px;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    cursor:pointer;
    transition:transform .55s cubic-bezier(.34,1.4,.64,1), top .55s cubic-bezier(.34,1.4,.64,1), width .55s ease, box-shadow .3s ease;
    z-index:1;
  }
  .photo-tuck{
    top:14%;
    transform:translate(-60%,0) rotate(-7deg);
    z-index:1;
  }
  .letter-tuck{
    top:2%;
    transform:translate(-42%,0) rotate(4deg);
    z-index:2;
  }
  .tucked.lifted{
    width:96%;
    box-shadow:0 20px 40px rgba(0,0,0,.45);
    z-index:10;
  }
  .letter-tuck.lifted{ top:-22%; transform:translate(-50%,0) rotate(0deg); width:104%; }

  /* ---------- PHOTO PAGE ---------- */
  .photo-page{
    background:#e3d3ac;
    display:flex; align-items:center; justify-content:center;
    padding:5%;
  }
  .photo-frame{
    width:100%; height:100%;
    border:10px solid #fdf6e8;
    box-shadow:0 10px 26px rgba(0,0,0,.35);
    cursor:pointer;
    overflow:hidden;
    border-radius:2px;
    transition:transform .4s cubic-bezier(.34,1.4,.64,1);
  }
  .photo-frame img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-frame.zoomed{ transform:scale(1.28); z-index:10; box-shadow:0 26px 50px rgba(0,0,0,.45); }

  /* ---------- nav arrows / dots ---------- */
  .nav-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.75); border:1px solid rgba(0,0,0,.15);
    font-size:1rem; cursor:pointer; z-index:30;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    transition:opacity .3s ease;
  }
  .nav-arrow.next{ right:10px; }
  .nav-arrow.prev{ left:10px; }
  .nav-arrow.hidden-nav{ opacity:0; pointer-events:none; }
  .page-dots{
    display:flex; gap:7px; margin-top:16px; justify-content:center;
  }
  .page-dots span{
    width:7px; height:7px; border-radius:50%; background:rgba(0,0,0,.2);
    transition:background .3s ease;
  }
  .page-dots span.active{ background:var(--accent); }

  /* ---------- RIGHT PAGE: candles ---------- */
  .right-page{ background:#e9ddc2; }
  .cake-wrap{
    position:absolute; inset:0;
  }
  .cake-img{width:100%; height:100%; display:block; object-fit:cover;}
  .flame{
    position:absolute;
    transform-origin:50% 90%;
    filter:drop-shadow(0 0 6px rgba(255,190,60,.55));
    transition:opacity .5s ease;
    will-change:transform;
  }
  .flame.out{ opacity:0; }

  .meter-wrap{
    position:absolute; left:8%; top:6%; width:34%;
    background:rgba(255,255,255,.55);
    border-radius:20px;
    padding:5px 8px;
    display:flex; align-items:center; gap:6px;
    font-size:.62rem;
    color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .meter-track{
    flex:1; height:7px; background:rgba(0,0,0,.15); border-radius:6px; overflow:hidden;
  }
  .meter-fill{
    height:100%; width:0%; background:linear-gradient(90deg,#e8b62b,var(--accent));
    transition:width .06s linear;
  }

  .blow-btn{
    position:absolute; left:50%; bottom:6%; transform:translateX(-50%);
    background:var(--accent); color:#fdf3e2; border:none;
    padding:10px 18px; border-radius:30px; font-family:inherit; font-size:.8rem;
    cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,.3);
    user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; gap:6px;
  }
  .blow-btn:active{transform:translateX(-50%) scale(.96);}
  .mic-warning{
    position:absolute; left:8%; right:8%; top:14%;
    font-size:.6rem; text-align:center; color:var(--accent);
    background:rgba(255,255,255,.7); border-radius:8px; padding:5px 7px;
    display:none;
  }
  .mic-warning.show{display:block;}

  .wish-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px;
    background:rgba(233,221,194,0);
    opacity:0; pointer-events:none;
    transition:opacity .6s ease, background .6s ease;
  }
  .wish-overlay.show{ opacity:1; pointer-events:auto; background:rgba(233,221,194,.55); }
  .wish-text{
    font-size:1.25rem; font-style:italic; color:var(--accent);
    text-shadow:0 2px 6px rgba(255,255,255,.6);
    padding:0 10%;
  }
  .relight-btn{
    background:#fdf3e2; color:var(--accent); border:1px solid var(--accent);
    padding:8px 16px; border-radius:24px; font-family:inherit; font-size:.75rem; cursor:pointer;
  }

  #confettiCanvas{
    position:absolute; inset:0; pointer-events:none; z-index:20;
  }

  /* ---------- back button ---------- */
  #backBtn{
    margin-top:26px;
    background:none; border:1px solid var(--kraft-dark); color:var(--ink);
    font-family:inherit; font-size:.78rem; padding:8px 16px; border-radius:20px;
    cursor:pointer; opacity:0; pointer-events:none; transition:opacity .4s ease;
  }
  #backBtn.show{opacity:.85; pointer-events:auto;}
  #backBtn:hover{opacity:1;}

  .hidden{display:none !important;}
</style>
</head>

<button id="backBtn">← back to cover</button>

<script>
(function(){
  "use strict";

  var NAME = "Anu";
  // flame positions/sizes at 700x990 page reference resolution
  var FLAMES = [
    {x0:200,y0:307,w:57,h:124},
    {x0:290,y0:307,w:68,h:124},
    {x0:372,y0:309,w:51,h:122},
    {x0:449,y0:319,w:53,h:113}
  ];
  var REF_W = 700, REF_H = 990;

  var coverCard = document.getElementById('coverCard');
  var stage = document.getElementById('stage');
  var leaves = [document.getElementById('leaf0'), document.getElementById('leaf1'), document.getElementById('leaf2')];
  var backBtn = document.getElementById('backBtn');
  var letterTuck = document.getElementById('letterTuck');
  var photoFrame = document.getElementById('photoFrame');
  var cakeWrap = document.getElementById('cakeWrap');
  var meterFill = document.getElementById('meterFill');
  var micWarning = document.getElementById('micWarning');
  var blowBtn = document.getElementById('blowBtn');
  var wishOverlay = document.getElementById('wishOverlay');
  var relightBtn = document.getElementById('relightBtn');
  var confettiCanvas = document.getElementById('confettiCanvas');
  var dots = document.querySelectorAll('.page-dots span');

  document.querySelector('.wish-text').textContent = 'make a wish, ' + NAME + ' \uD83C\uDF82';

  /* ---------------- open / close card ---------------- */
  function openCard(){
    coverCard.classList.add('opening');
    setTimeout(function(){
      coverCard.classList.add('hidden');
      showPage(0);
      backBtn.classList.add('show');
    }, 620);
  }
  function closeCard(){
    leaves.forEach(function(l){ l.classList.remove('show'); });
    backBtn.classList.remove('show');
    resetCandles();
    stopMic();
    setTimeout(function(){
      coverCard.classList.remove('hidden');
      coverCard.style.transition = 'none';
      coverCard.classList.remove('opening');
      void coverCard.offsetWidth;
      coverCard.style.transition = '';
    }, 380);
  }
  coverCard.addEventListener('click', openCard);
  backBtn.addEventListener('click', closeCard);

  /* ---------------- page navigation ---------------- */
  function showPage(idx){
    leaves.forEach(function(l,i){ l.classList.toggle('show', i===idx); });
    dots.forEach(function(d,i){ d.classList.toggle('active', i===idx); });
    if(idx === 2){ positionFlames(); startMic(); }
  }
  document.getElementById('next0').addEventListener('click', function(){ showPage(1); });
  document.getElementById('prev1').addEventListener('click', function(){ showPage(0); });
  document.getElementById('next1').addEventListener('click', function(){ showPage(2); });
  document.getElementById('prev2').addEventListener('click', function(){ showPage(1); });
  dots.forEach(function(d){
    d.addEventListener('click', function(){ showPage(parseInt(d.dataset.p,10)); });
  });

  /* ---------------- envelope tuck / lift ---------------- */
  letterTuck.addEventListener('click', function(){ letterTuck.classList.toggle('lifted'); });
  photoFrame.addEventListener('click', function(){ photoFrame.classList.toggle('zoomed'); });

  /* ---------------- flame positioning ---------------- */
  function positionFlames(){
    var rect = cakeWrap.getBoundingClientRect();
    var scale = rect.width / REF_W;
    for(var i=0;i<4;i++){
      var f = document.getElementById('flame'+i);
      var d = FLAMES[i];
      f.style.left = (d.x0*scale) + 'px';
      f.style.top = (d.y0*scale) + 'px';
      f.style.width = (d.w*scale) + 'px';
      f.style.height = (d.h*scale) + 'px';
    }
  }
  window.addEventListener('resize', positionFlames);

  /* ---------------- candle blow logic ---------------- */
  var candlesOut = false;
  var blowMs = 0;
  var lastTick = null;
  var BLOW_THRESHOLD = 0.16;
  var NEEDED_MS = 500;
  var rafId = null;

  function setLevel(level){
    level = Math.max(0, Math.min(1, level));
    meterFill.style.width = (level*100) + '%';
    if(candlesOut) return;

    var now = performance.now();
    if(lastTick === null) lastTick = now;
    var dt = now - lastTick;
    lastTick = now;

    if(level > BLOW_THRESHOLD){
      blowMs += dt;
      var bendStrength = Math.min(1, (level-BLOW_THRESHOLD)/(0.6-BLOW_THRESHOLD));
      bendFlames(bendStrength);
      if(blowMs >= NEEDED_MS){
        extinguish();
      }
    } else {
      blowMs = Math.max(0, blowMs - dt*1.5);
      bendFlames(0);
    }
  }

  function bendFlames(strength){
    for(var i=0;i<4;i++){
      var f = document.getElementById('flame'+i);
      var wobble = Math.sin(performance.now()/70 + i*2)*3*strength;
      var angle = 18*strength + wobble;
      var scaleY = 1 - 0.12*strength;
      f.style.transform = 'rotate('+angle.toFixed(1)+'deg) scaleY('+scaleY.toFixed(2)+')';
    }
  }

  function extinguish(){
    candlesOut = true;
    for(var i=0;i<4;i++){
      document.getElementById('flame'+i).classList.add('out');
    }
    setTimeout(function(){
      wishOverlay.classList.add('show');
      burstConfetti();
    }, 450);
  }

  function resetCandles(){
    candlesOut = false;
    blowMs = 0; lastTick = null;
    wishOverlay.classList.remove('show');
    for(var i=0;i<4;i++){
      var f = document.getElementById('flame'+i);
      f.classList.remove('out');
      f.style.transform = 'rotate(0deg) scaleY(1)';
    }
    meterFill.style.width = '0%';
  }
  relightBtn.addEventListener('click', resetCandles);

  /* ---------------- mic input via Web Audio API ---------------- */
  var audioCtx = null, analyser = null, dataArr = null, micActive = false, micStream = null, micRequested = false;

  function startMic(){
    if(micRequested) return;
    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      micWarning.textContent = 'mic needs https — open the hosted link, or use the button below';
      micWarning.classList.add('show');
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micWarning.classList.add('show');
      return;
    }
    micRequested = true;
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      micStream = stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.6;
      dataArr = new Uint8Array(analyser.frequencyBinCount);
      src.connect(analyser);
      micActive = true;
      micWarning.classList.remove('show');
      loop();
    }).catch(function(){
      micWarning.classList.add('show');
    });
  }

  function stopMic(){
    if(micStream){ micStream.getTracks().forEach(function(t){ t.stop(); }); }
    if(audioCtx){ audioCtx.close(); }
    micActive = false; micRequested = false; audioCtx = null; micStream = null;
    if(rafId) cancelAnimationFrame(rafId);
  }

  function loop(){
    rafId = requestAnimationFrame(loop);
    if(!micActive || simulating) return;
    analyser.getByteTimeDomainData(dataArr);
    var sum = 0;
    for(var i=0;i<dataArr.length;i++){
      var v = (dataArr[i]-128)/128;
      sum += v*v;
    }
    var rms = Math.sqrt(sum/dataArr.length);
    setLevel(rms*3.2);
  }

  /* ---------------- hold-to-blow fallback ---------------- */
  var simulating = false, simRaf = null, simStart = 0;
  function simTick(){
    var t = (performance.now()-simStart)/300;
    var lvl = Math.min(0.85, t*0.85);
    setLevel(lvl);
    if(simulating) simRaf = requestAnimationFrame(simTick);
  }
  function startSim(){
    if(simulating || candlesOut) return;
    simulating = true;
    simStart = performance.now();
    lastTick = null;
    simTick();
  }
  function stopSim(){
    simulating = false;
    if(simRaf) cancelAnimationFrame(simRaf);
    if(!candlesOut) setLevel(0);
  }
  blowBtn.addEventListener('mousedown', startSim);
  blowBtn.addEventListener('touchstart', function(e){ e.preventDefault(); startSim(); }, {passive:false});
  window.addEventListener('mouseup', stopSim);
  window.addEventListener('touchend', stopSim);
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' && leaves[2].classList.contains('show')){
      e.preventDefault();
      startSim();
    }
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'Space') stopSim();
  });

  /* ---------------- confetti ---------------- */
  var ctx = confettiCanvas.getContext('2d');
  var particles = [];
  var confettiRaf = null;
  var colors = ['#e8b62b','#8f2d2d','#3d6b8f','#d97757','#ffffff'];

  function resizeCanvas(){
    var r = cakeWrap.getBoundingClientRect();
    confettiCanvas.width = r.width;
    confettiCanvas.height = r.height;
  }
  window.addEventListener('resize', resizeCanvas);

  function burstConfetti(){
    resizeCanvas();
    particles = [];
    for(var i=0;i<90;i++){
      particles.push({
        x: confettiCanvas.width/2 + (Math.random()-0.5)*40,
        y: confettiCanvas.height*0.35,
        vx: (Math.random()-0.5)*6,
        vy: -Math.random()*6-2,
        size: 4+Math.random()*4,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.3,
        life: 0
      });
    }
    if(confettiRaf) cancelAnimationFrame(confettiRaf);
    confettiStep();
  }
  function confettiStep(){
    ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    var alive = false;
    particles.forEach(function(p){
      p.vy += 0.18;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      if(p.y < confettiCanvas.height+20 && p.life < 240){
        alive = true;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        ctx.restore();
      }
    });
    if(alive) confettiRaf = requestAnimationFrame(confettiStep);
    else ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  }

})();
</script>
</body>
